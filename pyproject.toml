[project]
name = "voiceqa"
version = "1.0.0"
description = "A spoken-question answering pipeline: pluggable speech-to-text, TF-IDF retrieval over a knowledge base, an LLM that answers grounded in the retrieved context, and an LLM grader that scores groundedness and flags low-confidence answers for human escalation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo David Padilla Romero" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "scikit-learn>=1.5",
  "numpy>=2.1",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
voiceqa = "voiceqa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voiceqa*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
